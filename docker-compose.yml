services:
  timesheetlite:
    build: .
    container_name: timesheetlite
    restart: unless-stopped
    ports:
      - "10.10.1.107:1000:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./certs/timesheetlite.pfx
        target: /https/timesheetlite.pfx
        read_only: true
      - type: volume
        source: timesheet-keys
        target: /keys
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "https://+:8443;http://+:8080"
      ASPNETCORE_HTTPS_PORTS: "8443"
      Kestrel__Certificates__Default__Path: "/https/timesheetlite.pfx"
      Kestrel__Certificates__Default__Password: "1234"
      DataProtection__KeyPath: "/keys"
      ConnectionStrings__DefaultConnection: "Server=10.10.1.107,11433;Database=Timesheet;User Id=sa;Password=devtime#1;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Clockify__ApiKey: "${CLOCKIFY_API_KEY:-}"
      Clockify__WorkspaceId: "${CLOCKIFY_WORKSPACE_ID:-}"
      Clockify__TimeZone: "${CLOCKIFY_TIME_ZONE:-}"

volumes:
  timesheet-keys:
